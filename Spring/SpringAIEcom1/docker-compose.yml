services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pgvector
    restart: always

    environment:
      POSTGRES_DB: springai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: